name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - master
    paths-ignore:
      - README.md

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  MAUI_XCODE_VERSION: '^26'

jobs:
  build_maui:
    name: Build MAUI library and sample (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Xcode version
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.MAUI_XCODE_VERSION }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Display .NET information
        run: dotnet --info

      - name: Build MAUI library
        run: dotnet build src/Plugin.ThemeKit.Maui/Plugin.ThemeKit.Maui.csproj --configuration Release

      - name: Build MAUI sample
        run: dotnet build samples/Plugin.ThemeKit.Maui.Sample/Plugin.ThemeKit.Maui.Sample.csproj --configuration Release

  build_winui:
    name: Build WinUI library and sample
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display .NET information
        run: dotnet --info

      - name: Build WinUI sample
        run: dotnet build samples/Plugin.ThemeKit.WinUI.Sample/Plugin.ThemeKit.WinUI.Sample.csproj --configuration Release -p:Platform=x64

  test:
    name: Run tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: dotnet test tests/Plugin.ThemeKit.Tests/Plugin.ThemeKit.Tests.csproj --configuration Release

  pack:
    name: Pack NuGet packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build_maui
      - build_winui
      - test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Validate tag and pack libraries
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:GITHUB_REF_NAME' must use the vMAJOR.MINOR.PATCH[-prerelease] format."
          }
          dotnet pack src/Plugin.ThemeKit/Plugin.ThemeKit.csproj --configuration Release --output ./artifacts -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Plugin.ThemeKit.Maui/Plugin.ThemeKit.Maui.csproj --configuration Release --output ./artifacts -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Plugin.ThemeKit.WinUI/Plugin.ThemeKit.WinUI.csproj --configuration Release --output ./artifacts -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to NuGet.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: windows-latest
    environment: nuget.org
    permissions:
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Log in to NuGet.org
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $packages = @('IgrisModz.Plugin.ThemeKit', 'IgrisModz.Plugin.ThemeKit.Maui', 'IgrisModz.Plugin.ThemeKit.WinUI')
          $paths = foreach ($package in $packages) {
            $path = "./artifacts/$package.$version.nupkg"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Package not found: $path"
            }
            $path
          }
          foreach ($path in $paths) {
            dotnet nuget push $path --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }